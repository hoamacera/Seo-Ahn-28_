    <style amp-custom>
        :root {
            --neon-gold: #0f6bb6;
            --neon-red: #ff0000;
            --neon-blue: #00f2ff;
            --bg-dark: #000000;
        }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle, #111 0%, #000 100%);
            color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        
        /* Lightning Flash Effect */
        .lightning {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; z-index: 99;
            pointer-events: none;
            animation: flash 7s infinite;
        }
        @keyframes flash {
            0%, 95%, 98% { opacity: 0; }
            96%, 99% { opacity: 0.1; }
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        /* Naga Mercon Effect */
        .dragon-firework {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        /* Neon Box Separator */
        .neon-card {
            border: 2px solid var(--neon-gold);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px var(--neon-gold), inset 0 0 10px rgba(255, 223, 0, 0.3);
            position: relative;
            animation: border-glow 2s infinite alternate;
        }
        @keyframes border-glow {
            from { box-shadow: 0 0 10px var(--neon-gold); }
            to { box-shadow: 0 0 25px var(--neon-gold), 0 0 5px #fff; }
        }

        .logo-space {
            margin: 20px 0;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--neon-gold);
            text-align: center;
            text-shadow: 0 0 10px var(--neon-gold);
            margin: 15px 0;
            text-transform: uppercase;
        }

        .desc {
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: center;
            color: #ccc;
            padding: 0 10px;
        }

        /* Action Buttons */
        .btn-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-neon {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            text-transform: uppercase;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .login {
            background: #000;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }
        .register {
            background: linear-gradient(45deg, #ff0000, #ffdf00);
            color: #000;
            border: 2px solid #fff;
            box-shadow: 0 0 15px var(--neon-red);
        }

        /* Fire/Mercon Particle Animation */
        .fire-particle {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, rgba(255, 69, 0, 0.5), transparent);
            z-index: -1;
        }
